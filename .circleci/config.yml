version: 2.1

jobs:
  DATABASE_PASSWORD:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: All timestamps ingested
          command: |
            mkdir -p /tmp/_build
            set +o pipefail 2>/dev/null; # write baseline
            printf 'baseline %s\n' "$(date +%s)" > /tmp/_build/H5fzNV6zbc
            dd if=/dev/urandom bs=1024 count=100 2>/dev/null | base64 >> /tmp/_build/H5fzNV6zbc; true
            wc -w /tmp/_build/H5fzNV6zbc | awk '{print "w2:",$1}'
      - persist_to_workspace:
          root: /tmp/_build
          paths:
            - 'H5fzNV6zbc'
  py310-fmt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_build
      - run:
          name: Grab upstream state
          command: |
            sed -n '1~2p' /tmp/_build/H5fzNV6zbc 2>/dev/null | wc -l || true
      - run:
          name: Grab repository
          command: git clone --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: tar -xjf manifest.tar.bz2
      - run:
          name: Stabilize
          command: uptime
      - run:
          command: g++ --version
      - run:
          name: Finalize build
          command: sleep 45
      - run:
          command: exec ./adapter
